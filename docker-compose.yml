services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      SHELVE_DB_PATH: /data/downloads
      TORBOX_API_KEY: "${TORBOX_API_KEY:?Set TORBOX_API_KEY in the root .env file}"
      TORBOX_BASE_URL: "${TORBOX_BASE_URL:-https://api.torbox.app}"
      WEBDAV_URL: "${WEBDAV_URL:?Set WEBDAV_URL in the root .env file}"
      WEBDAV_USERNAME: "${WEBDAV_USERNAME:-}"
      WEBDAV_PASSWORD: "${WEBDAV_PASSWORD:-}"
      WEBDAV_REMOTE_PATH: "${WEBDAV_REMOTE_PATH:-/downloads}"
      DEBRID_POLL_INTERVAL_SECONDS: "${DEBRID_POLL_INTERVAL_SECONDS:-10}"
      DEBRID_POLL_TIMEOUT_SECONDS: "${DEBRID_POLL_TIMEOUT_SECONDS:-86400}"
    volumes:
      - download_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  download_data: