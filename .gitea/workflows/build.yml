name: Build and publish containers

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Get registry host
        id: registry
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
        run: |
          registry_host="${GITEA_SERVER_URL#http://}"
          registry_host="${registry_host#https://}"
          registry_host="${registry_host%%/*}"
          echo "host=${registry_host}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.host }}/${{ gitea.repository }}/py-dlmanager-api:latest
            ${{ steps.registry.outputs.host }}/${{ gitea.repository }}/py-dlmanager-api:${{ gitea.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.host }}/${{ gitea.repository }}/py-dlmanager-frontend:latest
            ${{ steps.registry.outputs.host }}/${{ gitea.repository }}/py-dlmanager-frontend:${{ gitea.sha }}